<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body class="min-h-screen flex flex-col bg-gray-50 dark:bg-gray-900">
    
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 relative">
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-primary/5 to-purple-500/5 z-0"></div>
        
        <div class="card p-5 sm:p-8 w-full max-w-lg z-10 glass-panel rounded-2xl shadow-xl my-6">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-primary/10 text-primary mb-3">
                    <i class="bi bi-person-plus text-2xl"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white">Create an account</h2>
                <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">Join Virtual Queue today</p>
            </div>

            <div th:if="${param.success}" class="bg-emerald-100 dark:bg-emerald-900/30 border border-emerald-400 text-emerald-700 dark:text-emerald-300 px-4 py-3 rounded-xl text-xs sm:text-sm mb-4" role="alert">
                <span>Registration successful! Please check your email for OTP verification.</span>
            </div>

            <form th:action="@{/register}" th:object="${userDto}" method="post" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">First Name</label>
                        <input type="text" th:field="*{firstName}" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl text-base dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="John" required>
                        <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Last Name</label>
                        <input type="text" th:field="*{lastName}" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl text-base dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="Doe" required>
                        <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs sm:text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Email Address</label>
                    <input type="email" th:field="*{email}" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl text-base dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="john@example.com" required>
                    <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                
                <div>
                    <label class="block text-xs sm:text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Phone Number</label>
                    <input type="text" th:field="*{phone}" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl text-base dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="98XXXXXXXX" required>
                    <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Password</label>
                    <input type="password" th:field="*{password}" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl text-base dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="••••••••" required>
                    <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <button type="submit" class="btn-primary w-full py-3 mt-2 text-sm font-bold rounded-xl shadow-lg">Create Account</button>
            </form>

            <div class="mt-6 text-center text-xs sm:text-sm">
                <span class="text-gray-500">Already have an account?</span>
                <a th:href="@{/login}" class="text-primary font-bold hover:underline ml-1">Sign in</a>
            </div>
        </div>
    </main>

</body>
</html>
