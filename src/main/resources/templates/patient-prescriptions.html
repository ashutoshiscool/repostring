<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('My Prescriptions')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
            <i class="bi bi-heart-pulse-fill text-primary text-xl mr-2"></i>
            <span class="text-lg font-bold">VirtualQueue</span>
        </div>
        <nav class="flex-grow py-4 px-3 space-y-1">
            <a th:href="@{/patient/dashboard}" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg font-medium transition-colors">
                <i class="bi bi-grid-1x2-fill mr-3"></i> Dashboard
            </a>
            <a th:href="@{/patient/book-appointment}" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg font-medium transition-colors">
                <i class="bi bi-calendar-plus mr-3"></i> Book Appointment
            </a>
            <a th:href="@{/patient/appointments}" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg font-medium transition-colors">
                <i class="bi bi-journal-medical mr-3"></i> My Appointments
            </a>
            <a th:href="@{/patient/prescriptions}" class="flex items-center px-3 py-2 text-primary bg-primary/10 rounded-lg font-medium">
                <i class="bi bi-file-earmark-medical mr-3"></i> My Prescriptions
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="flex items-center w-full px-3 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg font-medium transition-colors">
                    <i class="bi bi-box-arrow-right mr-3"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Mobile Nav Header -->
    <div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center">
            <i class="bi bi-heart-pulse-fill text-primary text-xl mr-2"></i>
            <span class="text-lg font-bold">VirtualQueue</span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="text-red-500"><i class="bi bi-box-arrow-right text-xl"></i></button>
        </form>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 hidden md:flex items-center justify-between px-6">
            <h1 class="text-xl font-semibold">My Prescriptions</h1>
            <div class="flex items-center space-x-4">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center font-bold" th:text="${patientName != null ? #strings.substring(patientName, 0, 1) : 'P'}">
                        P
                    </div>
                    <span class="ml-2 font-medium text-sm hidden sm:block" sec:authentication="name">Patient User</span>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <div class="card p-6 bg-white dark:bg-gray-800 shadow rounded-xl border border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-bold mb-6">Prescription History</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-sm text-gray-500 border-b border-gray-200 dark:border-gray-700">
                                <th class="pb-3 font-medium">Date</th>
                                <th class="pb-3 font-medium">Doctor</th>
                                <th class="pb-3 font-medium">Notes Summary</th>
                                <th class="pb-3 font-medium">Image Attachment</th>
                                <th class="pb-3 font-medium text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm">
                            <tr th:if="${#lists.isEmpty(prescriptions)}">
                                <td colspan="5" class="py-6 text-center text-gray-500">No prescriptions found.</td>
                            </tr>
                            <tr th:each="p : ${prescriptions}" class="border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                                <td class="py-4 font-medium" th:text="${#temporals.format(p.createdAt, 'MMM dd, yyyy')}">Oct 12, 2026</td>
                                <td class="py-4 font-medium" th:text="${'Dr. ' + p.doctor.firstName + ' ' + p.doctor.lastName}">Dr. Sanjay Thapa</td>
                                <td class="py-4 text-gray-600 dark:text-gray-400 max-w-[250px] truncate" th:text="${p.notes != null ? p.notes : 'No typed notes'}">Notes</td>
                                <td class="py-4">
                                    <span th:if="${p.imagePath != null}" class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-semibold"><i class="bi bi-file-image mr-1"></i>Attached</span>
                                    <span th:if="${p.imagePath == null}" class="text-gray-400 text-xs">None</span>
                                </td>
                                <td class="py-4 text-right">
                                    <a th:href="@{/patient/appointment/{id}/prescription(id=${p.appointment.id})}" class="btn-primary py-1 px-3 text-xs font-medium rounded">View</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
