<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reset Password')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="card p-8 max-w-md w-full bg-white dark:bg-gray-800 shadow-xl rounded-2xl border border-gray-200 dark:border-gray-700">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-purple-100 dark:bg-purple-900/30 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                <i class="bi bi-lock-fill"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Reset Account Password</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                Enter the 6-digit OTP code sent to your email along with your new password.
            </p>
        </div>

        <div th:if="${error}" class="p-3 bg-red-100 border border-red-200 text-red-700 text-xs rounded-lg mb-4 text-center font-medium" th:text="${error}">
            Error message
        </div>

        <form th:action="@{/reset-password}" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" name="email" th:value="${email}" required
                       class="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white text-sm"
                       placeholder="name@gmail.com">
            </div>

            <div>
                <label for="otpCode" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">6-Digit Reset OTP Code</label>
                <input type="text" id="otpCode" name="otpCode" maxlength="6" pattern="\d{6}" required
                       class="w-full text-center text-2xl font-extrabold tracking-[8px] py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white"
                       placeholder="123456" autofocus>
            </div>

            <div>
                <label for="newPassword" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">New Password</label>
                <input type="password" id="newPassword" name="newPassword" minlength="6" required
                       class="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white text-sm"
                       placeholder="At least 6 characters">
            </div>

            <button type="submit" class="w-full btn-primary py-3 font-semibold rounded-xl shadow-lg transition-transform active:scale-95 mt-2">
                Set New Password & Login
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            Back to <a th:href="@{/login}" class="text-primary font-semibold hover:underline">Login Page</a>
        </div>
    </div>

</body>
</html>
