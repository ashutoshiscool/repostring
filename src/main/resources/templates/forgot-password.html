<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forgot Password')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="card p-8 max-w-md w-full bg-white dark:bg-gray-800 shadow-xl rounded-2xl border border-gray-200 dark:border-gray-700">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                <i class="bi bi-key-fill"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Forgot Password?</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                Enter your registered email address and we will send you a 6-digit OTP code to reset your password.
            </p>
        </div>

        <div th:if="${error}" class="p-3 bg-red-100 border border-red-200 text-red-700 text-xs rounded-lg mb-4 text-center font-medium" th:text="${error}">
            Error message
        </div>

        <form th:action="@{/forgot-password}" method="post" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Registered Email Address</label>
                <input type="email" id="email" name="email" required
                       class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white"
                       placeholder="name@gmail.com">
            </div>

            <button type="submit" class="w-full btn-primary py-3 font-semibold rounded-xl shadow-lg transition-transform active:scale-95">
                Send Reset OTP Code
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            Remembered your password? <a th:href="@{/login}" class="text-primary font-semibold hover:underline">Back to Login</a>
        </div>
    </div>

</body>
</html>
