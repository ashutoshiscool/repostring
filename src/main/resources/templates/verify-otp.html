<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Verify Email OTP')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="card p-8 max-w-md w-full bg-white dark:bg-gray-800 shadow-xl rounded-2xl border border-gray-200 dark:border-gray-700">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Email Verification</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                Enter the 6-digit OTP code sent to <br>
                <strong class="text-gray-800 dark:text-gray-200" th:text="${email != null ? email : 'your email address'}">user@example.com</strong>
            </p>
        </div>

        <!-- Alert messages -->
        <div th:if="${error}" class="p-3 bg-red-100 border border-red-200 text-red-700 text-xs rounded-lg mb-4 text-center font-medium" th:text="${error}">
            Invalid OTP Code
        </div>

        <form th:action="@{/verify-otp}" method="post" class="space-y-6">
            <input type="hidden" name="email" th:value="${email}">
            
            <div>
                <label for="otpCode" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-2 text-center">
                    6-Digit Verification Code
                </label>
                <input type="text" id="otpCode" name="otpCode" maxlength="6" pattern="\d{6}" required
                       class="w-full text-center text-3xl font-extrabold tracking-[10px] py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white"
                       placeholder="123456" autofocus>
            </div>

            <button type="submit" class="w-full btn-primary py-3 font-semibold rounded-xl shadow-lg transition-transform active:scale-95">
                Verify Email & Activate Account
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-500">
            Didn't receive code? Check spam or <a th:href="@{/register}" class="text-primary font-semibold hover:underline">Register again</a>
        </div>
    </div>

</body>
</html>
