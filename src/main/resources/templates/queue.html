<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Today\'s Queue')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col md:flex-row">

    <!-- Desktop Sidebar -->
    <aside class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 hidden md:flex flex-col flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
            <i class="bi bi-heart-pulse-fill text-primary text-xl mr-2"></i>
            <span class="text-lg font-bold">VirtualQueue Doctor</span>
        </div>
        <nav class="flex-grow py-4 px-3 space-y-1">
            <a th:href="@{/doctor/dashboard}" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">
                <i class="bi bi-grid-1x2-fill mr-3"></i> Dashboard
            </a>
            <a th:href="@{/doctor/queue}" class="flex items-center px-3 py-2 text-primary bg-primary/10 rounded-xl font-bold">
                <i class="bi bi-list-ol mr-3"></i> Today's Queue
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="flex items-center w-full px-3 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl font-semibold transition-colors">
                    <i class="bi bi-box-arrow-right mr-3"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Responsive Header -->
        <header th:replace="~{fragments :: adminHeader('Today\'s Queue', 'queues')}"></header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
            <div class="card p-4 sm:p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-gray-900 dark:text-white">Live Patient Queue</h2>
                        <p class="text-xs text-gray-500">Real-time consultation management</p>
                    </div>
                    <form th:action="@{/doctor/queue/next}" method="post" class="w-full sm:w-auto">
                        <button type="submit" class="btn-primary py-2.5 px-5 text-xs sm:text-sm font-bold rounded-xl shadow w-full sm:w-auto flex items-center justify-center">
                            <i class="bi bi-megaphone-fill mr-2 text-base"></i> Call Next Patient
                        </button>
                    </form>
                </div>
                
                <div class="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0">
                    <table class="w-full text-left border-collapse min-w-[650px]">
                        <thead>
                            <tr class="text-xs text-gray-400 uppercase border-b border-gray-200 dark:border-gray-700">
                                <th class="pb-3 font-semibold w-16">Q No.</th>
                                <th class="pb-3 font-semibold">Patient Name</th>
                                <th class="pb-3 font-semibold">Time Slot</th>
                                <th class="pb-3 font-semibold">Type</th>
                                <th class="pb-3 font-semibold">Status</th>
                                <th class="pb-3 font-semibold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="text-xs sm:text-sm divide-y divide-gray-100 dark:divide-gray-800">
                            <tr th:if="${#lists.isEmpty(queueList)}">
                                <td colspan="6" class="py-6 text-center text-gray-500">No patients in queue today.</td>
                            </tr>
                            <tr th:each="q : ${queueList}" class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors" th:classappend="${q.status == 'IN_PROGRESS'} ? 'bg-blue-50/70 dark:bg-blue-900/20'">
                                <td class="py-4">
                                    <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-extrabold text-sm shadow-sm"
                                         th:classappend="${q.status == 'WAITING' ? 'bg-amber-100 text-amber-800' : (q.status == 'IN_PROGRESS' ? 'bg-primary text-white shadow-lg shadow-primary/30' : 'bg-emerald-100 text-emerald-800')}">
                                        <span th:text="${q.queueNumber}">1</span>
                                    </div>
                                </td>
                                <td class="py-4 font-bold text-gray-900 dark:text-white">
                                    <a th:href="@{/doctor/patient/{id}(id=${q.appointment.patient.id})}" class="text-primary hover:underline" th:text="${q.appointment.patient.firstName + ' ' + q.appointment.patient.lastName}">Jane Smith</a>
                                </td>
                                <td class="py-4 text-gray-500 dark:text-gray-400" th:text="${q.appointment.timeSlot}">10:30 AM</td>
                                <td class="py-4">
                                    <span th:if="${q.priorityLevel == 'EMERGENCY'}" class="text-red-600 font-bold flex items-center"><i class="bi bi-exclamation-triangle-fill mr-1"></i>Emergency</span>
                                    <span th:if="${q.priorityLevel != 'EMERGENCY'}" class="text-gray-500 font-medium">Normal</span>
                                </td>
                                <td class="py-4">
                                    <span th:if="${q.status == 'WAITING'}" class="px-2.5 py-1 bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300 rounded-full text-xs font-bold">Waiting</span>
                                    <span th:if="${q.status == 'IN_PROGRESS'}" class="px-2.5 py-1 bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300 rounded-full text-xs font-bold border border-blue-200">In Progress</span>
                                    <span th:if="${q.status == 'COMPLETED'}" class="px-2.5 py-1 bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300 rounded-full text-xs font-bold">Completed</span>
                                    <span th:if="${q.status == 'CANCELLED'}" class="px-2.5 py-1 bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300 rounded-full text-xs font-bold">Cancelled</span>
                                </td>
                                <td class="py-4 text-right">
                                    <div class="flex items-center justify-end space-x-1.5">
                                        <a th:href="@{/doctor/appointment/{id}/prescription(id=${q.appointment.id})}" class="text-xs px-2.5 py-1.5 bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-300 hover:bg-purple-200 rounded-lg font-bold flex items-center transition-colors" title="Attach/View Prescription">
                                            <i class="bi bi-file-earmark-medical mr-1"></i> Rx
                                        </a>
                                        <form th:if="${q.status == 'WAITING'}" th:action="@{/doctor/queue/{id}/status(id=${q.id},status='IN_PROGRESS')}" method="post">
                                            <button type="submit" class="text-xs px-2.5 py-1.5 bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300 hover:bg-blue-200 rounded-lg font-bold">Start</button>
                                        </form>
                                        <form th:if="${q.status == 'IN_PROGRESS'}" th:action="@{/doctor/queue/{id}/status(id=${q.id},status='COMPLETED')}" method="post">
                                            <button type="submit" class="text-xs px-2.5 py-1.5 bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300 hover:bg-emerald-200 rounded-lg font-bold">Complete</button>
                                        </form>
                                        <a th:if="${q.status == 'WAITING'}" th:href="@{/doctor/queue/{id}/reschedule(id=${q.id})}" class="text-xs px-2.5 py-1.5 bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300 hover:bg-gray-200 rounded-lg font-semibold">Reschedule</a>
                                        <form th:if="${q.status == 'WAITING' or q.status == 'IN_PROGRESS'}" th:action="@{/doctor/queue/{id}/status(id=${q.id},status='CANCELLED')}" method="post">
                                            <button type="submit" class="text-xs px-2.5 py-1.5 bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300 hover:bg-red-200 rounded-lg font-bold">Cancel</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
