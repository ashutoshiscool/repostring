<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body class="min-h-screen flex flex-col bg-gray-50 dark:bg-gray-900">
    
    <nav th:replace="~{fragments :: navbar}"></nav>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 relative">
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-primary/5 to-purple-500/5 z-0"></div>
        
        <div class="card p-5 sm:p-8 w-full max-w-md z-10 glass-panel rounded-2xl shadow-xl">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-primary/10 text-primary mb-3">
                    <i class="bi bi-box-arrow-in-right text-2xl"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white">Welcome back</h2>
                <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1">Sign in to your account</p>
            </div>

            <div th:if="${param.error}" class="bg-red-100 dark:bg-red-900/30 border border-red-400 text-red-700 dark:text-red-300 px-4 py-3 rounded-xl text-xs sm:text-sm mb-4" role="alert">
                <span>Invalid email or password.</span>
            </div>
            <div th:if="${param.logout}" class="bg-emerald-100 dark:bg-emerald-900/30 border border-emerald-400 text-emerald-700 dark:text-emerald-300 px-4 py-3 rounded-xl text-xs sm:text-sm mb-4" role="alert">
                <span>You have been logged out.</span>
            </div>
            <div th:if="${param.verified}" class="bg-emerald-100 dark:bg-emerald-900/30 border border-emerald-400 text-emerald-700 dark:text-emerald-300 px-4 py-3 rounded-xl text-xs sm:text-sm mb-4" role="alert">
                <span>Your email has been verified! You can now log in.</span>
            </div>
            <div th:if="${param.resetSuccess}" class="bg-emerald-100 dark:bg-emerald-900/30 border border-emerald-400 text-emerald-700 dark:text-emerald-300 px-4 py-3 rounded-xl text-xs sm:text-sm mb-4" role="alert">
                <span>Password reset successful! Please sign in with your new password.</span>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label for="username" class="block text-xs sm:text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">Email address</label>
                    <input type="email" id="username" name="username" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl text-base dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="Enter your email" required autofocus>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="block text-xs sm:text-sm font-semibold text-gray-700 dark:text-gray-300">Password</label>
                        <a th:href="@{/forgot-password}" class="text-xs text-primary hover:underline font-semibold">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl text-base dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-primary focus:outline-none transition-all" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary w-full py-3 mt-2 text-sm font-bold rounded-xl shadow-lg">Sign In</button>
            </form>

            <div class="mt-6 text-center text-xs sm:text-sm">
                <span class="text-gray-500">Don't have an account?</span>
                <a th:href="@{/register}" class="text-primary font-bold hover:underline ml-1">Register now</a>
            </div>
        </div>
    </main>

</body>
</html>
