<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Patient Prescription')}"></head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
            <i class="bi bi-heart-pulse-fill text-primary text-xl mr-2"></i>
            <span class="text-lg font-bold">VirtualQueue</span>
        </div>
        <nav class="flex-grow py-4 px-3 space-y-1">
            <a th:href="@{/doctor/dashboard}" class="flex items-center px-3 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg font-medium transition-colors">
                <i class="bi bi-grid-1x2-fill mr-3"></i> Dashboard
            </a>
            <a th:href="@{/doctor/queue}" class="flex items-center px-3 py-2 text-primary bg-primary/10 rounded-lg font-medium">
                <i class="bi bi-list-ol mr-3"></i> Today's Queue
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="flex items-center w-full px-3 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg font-medium transition-colors">
                    <i class="bi bi-box-arrow-right mr-3"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Mobile Nav Header -->
    <div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center">
            <i class="bi bi-heart-pulse-fill text-primary text-xl mr-2"></i>
            <span class="text-lg font-bold">VirtualQueue</span>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="text-red-500"><i class="bi bi-box-arrow-right text-xl"></i></button>
        </form>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 hidden md:flex items-center justify-between px-6">
            <div class="flex items-center">
                <a th:href="@{/doctor/queue}" class="text-gray-500 hover:text-primary mr-4"><i class="bi bi-arrow-left text-xl"></i></a>
                <h1 class="text-xl font-semibold">Attach Patient Prescription</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold">
                        Dr
                    </div>
                    <span class="ml-2 font-medium text-sm hidden sm:block" sec:authentication="name">Doctor User</span>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <div class="max-w-3xl mx-auto space-y-6">
                
                <!-- Patient Summary Card -->
                <div class="card p-6 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800 rounded-xl">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white" th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}">Patient Name</h3>
                            <p class="text-sm text-gray-500" th:text="${'Phone: ' + appointment.patient.phone + ' | Gender: ' + (appointment.patient.gender != null ? appointment.patient.gender : 'N/A')}">Phone & Details</p>
                        </div>
                        <div class="text-right">
                            <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold" th:text="${appointment.type}">NORMAL</span>
                            <p class="text-xs text-gray-500 mt-1" th:text="${#temporals.format(appointment.appointmentDate, 'MMM dd, yyyy') + ' at ' + appointment.timeSlot}">Oct 12, 2026</p>
                        </div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-blue-200/50 text-sm">
                        <span class="font-medium text-gray-700 dark:text-gray-300">Reason: </span>
                        <span class="text-gray-600 dark:text-gray-400" th:text="${appointment.reason != null ? appointment.reason : 'General Consultation'}">Reason</span>
                    </div>
                </div>

                <!-- Prescription Form -->
                <div class="card p-6 bg-white dark:bg-gray-800 shadow rounded-xl border border-gray-200 dark:border-gray-700">
                    <form th:action="@{/doctor/appointment/{id}/prescription(id=${appointment.id})}" method="post" enctype="multipart/form-data" class="space-y-6">
                        
                        <div>
                            <label for="notes" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                                <i class="bi bi-file-earmark-medical mr-1 text-primary"></i> Prescription Notes / Medicines
                            </label>
                            <textarea id="notes" name="notes" rows="6" 
                                      class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white"
                                      placeholder="Type prescription notes, medicines, dosage, or specific instructions..." th:text="${prescription.notes}"></textarea>
                        </div>

                        <div>
                            <label for="image" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                                <i class="bi bi-image mr-1 text-primary"></i> Attach Prescription Image (PNG, JPG, JPEG)
                            </label>
                            <input type="file" id="image" name="image" accept="image/*" 
                                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary/90 cursor-pointer">
                            <p class="text-xs text-gray-500 mt-1">Upload a photo/scan of the handwritten or printed prescription image.</p>
                        </div>

                        <!-- Existing Image Preview -->
                        <div th:if="${prescription.imagePath != null}" class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg border border-gray-200 dark:border-gray-600">
                            <p class="text-xs font-semibold text-gray-600 dark:text-gray-300 mb-2">Currently Attached Prescription Image:</p>
                            <a th:href="${prescription.imagePath}" target="_blank">
                                <img th:src="${prescription.imagePath}" alt="Prescription Image" class="max-h-60 rounded border shadow-sm hover:opacity-95 transition-opacity">
                            </a>
                        </div>

                        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                            <a th:href="@{/doctor/queue}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 rounded-lg transition-colors">Cancel</a>
                            <button type="submit" class="btn-primary py-2 px-6 text-sm font-medium rounded-lg shadow">
                                <i class="bi bi-check-circle mr-2"></i> Save Prescription
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
