spring.application.name=virtualqueue
spring.datasource.url=jdbc:mysql://localhost:3306/virtualqueue?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=vqadmin
spring.datasource.password=vqpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# Multipart File Upload Configuration (Unlimited)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# Google OAuth 2.0 & Gmail API Configuration
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/gmail/callback}

# Token Encryption Secret
app.encryption.secret-key=${APP_ENCRYPTION_SECRET_KEY:VirtualQueueSecretKey2026AES256Key}
